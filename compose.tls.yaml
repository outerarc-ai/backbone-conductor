services:
  conductor:
    ports:
      - "${BACKBONE_TLS_BIND:-127.0.0.1}:${BACKBONE_TLS_PORT:-8443}:8000"
    volumes:
      - "${BACKBONE_TLS_DIR:?Set BACKBONE_TLS_DIR to a private certificate directory}:/run/tls:ro"
    command:
      - --repo
      - /workspace
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --auth-file
      - /run/secrets/backbone-http-tokens.json
      - --tls-certfile
      - /run/tls/server.crt
      - --tls-keyfile
      - /run/tls/server.key
